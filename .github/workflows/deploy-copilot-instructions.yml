name: Deploy Copilot Instructions

on:
  push:
    branches: [main]
    paths:
      - 'copilot-instructions/**'
  workflow_dispatch:
    inputs:
      team:
        description: 'Equipe cible (laisser vide pour toutes)'
        required: false
        type: choice
        options:
          - ''
          - 'spa'
          - 'api-backend'
          - 'data'
          - 'maven'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed teams
        id: changed-teams
        if: github.event_name == 'push'
        shell: bash
        run: |
          teams=$(git diff --name-only HEAD^ HEAD \
            | grep '^copilot-instructions/' \
            | awk -F'/' '{print $2}' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')
          echo "teams=$teams" >> "$GITHUB_OUTPUT"
          echo "Equipes concernees : $teams"

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: onyx-developpement

      - name: Deploy Copilot Instructions (App Token)
        env:
          # GH_TOKEN est lu automatiquement par gh CLI pour l'authentification
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # GITHUB_REPOSITORY_OWNER (org) et GITHUB_WORKSPACE (racine checkout)
          # sont positionnés automatiquement par le runner — pas besoin de les redéclarer.
          # Pour un push : on passe uniquement les équipes dont les fichiers ont changé.
          # Pour un workflow_dispatch : on passe l'input sélectionné (vide = toutes).
          INPUT_TEAM: ${{ github.event_name == 'push' && steps.changed-teams.outputs.teams || inputs.team }}
        shell: pwsh
        run: ./scripts/Deploy-CopilotInstructions.ps1
